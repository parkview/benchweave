[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchweave-adc"
version = "0.1.0"
description = "Capture and analysis gateway for the 6-channel 12-bit ADC board: web UI, MCP server, capture library."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Stephen Eaton" }
]
keywords = [
  "adc",
  "data-acquisition",
  "embedded systems",
  "instrumentation",
  "serial"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed"
]
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp>=2.2.0",
    "send2trash>=1.8",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "pytest-cov>=5",
  # Dev-only: adapter conformance (MockHost/check_lifecycle) and offline
  # descriptor/envelope validation. Runtime code never imports the SDK —
  # the Adapter/HostServices contracts are structural Protocols.
  "benchweave-sdk",
]

[tool.uv.sources]
# The PyPI 0.0.2 wheel predates the standards renumbering (it vendors
# otdp-v0.3.0; the daq profile lives in the renumbered otdp/0.1.0 corpus).
# Track upstream main until the next SDK release, then pin ">=0.0.3".
# The PyPI 0.0.2 wheel predates the standards renumbering (it vendors
# otdp-v0.3.0; the daq profile lives in the renumbered otdp/0.1.0 corpus),
# and installing upstream from git fails on Windows until the .gitattributes
# fix merges (madeinoz67/benchweave-sdk#9). Until an SDK 0.0.3 release, pin
# the fork branch carrying those fixes; then switch to 'benchweave-sdk>=0.0.3'.
benchweave-sdk = { git = "https://github.com/platima/benchweave-sdk", branch = "fix/portability-and-correctness" }

[project.scripts]
benchweave-adc = "benchweave.__main__:main"
benchweave-adc-mcp = "benchweave.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchweave", "plugins"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/benchweave", "plugins", "tests"]

# Coverage is report-only (run with `pytest --cov`); no threshold is enforced.
[tool.coverage.run]
source = ["src/benchweave", "plugins"]
branch = true
