<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BenchWeave ADC</title>
  <script src="/chart.umd.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 64rem; }
    h1 { margin: 0 0 0.5rem; }
    .tabs { margin-bottom: 1rem; }
    .tab { font-size: 0.95rem; padding: 0.4rem 0.9rem; cursor: pointer; }
    .tab.active { font-weight: 600; }
    section { margin: 1rem 0; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; }
    label, span { margin-right: 1rem; }
    button, select, input { font-size: 0.95rem; }
    #channels { display: inline-flex; gap: 0.75rem; flex-wrap: wrap; }
    #chart-box { height: 360px; }
    #status, #config-status { color: #555; }
    #channel-table { border-collapse: collapse; margin-top: 0.5rem; }
    #channel-table th, #channel-table td { border: 1px solid #ddd; padding: 0.3rem 0.5rem; }
    #channel-table td input { width: 6rem; }
  </style>
</head>
<body>
  <h1>BenchWeave ADC</h1>

  <div class="tabs">
    <button class="tab active" data-tab="control">Control</button>
    <button class="tab" data-tab="setup">Configuration</button>
  </div>

  <div id="tab-control">
    <section id="connect">
      <button id="discover-btn">Discover</button>
      <select id="board-select"></select>
      <button id="connect-btn">Connect</button>
      <span id="status">disconnected</span>
    </section>

    <section id="control" hidden>
      <label>Averaging
        <select id="averaging">
          <option value="0">0 (raw)</option>
          <option value="4">4</option>
          <option value="8">8</option>
          <option value="16">16</option>
          <option value="32">32</option>
          <option value="64">64</option>
          <option value="128">128</option>
          <option value="256">256</option>
        </select>
      </label>
      <span>Channels:</span>
      <span id="channels"></span>
      <label>Note: <input type="text" id="note" placeholder="optional note"></label>
      <label><input type="checkbox" id="record" checked> Record to CSV</label>
      <button id="stream-toggle">Start</button>
    </section>

    <section id="graph">
      <div id="chart-box"><canvas id="chart"></canvas></div>
    </section>
  </div>

  <div id="tab-setup" hidden>
    <section id="channel-config">
      <label>Profile
        <select id="profile-select"></select>
      </label>
      <input type="text" id="new-profile-name" placeholder="new profile name">
      <button id="new-profile">New</button>
      <button id="save-config">Save</button>
      <span id="config-status"></span>
      <table id="channel-table">
        <thead>
          <tr><th>Channel</th><th>Name</th><th>Unit</th><th>Gain</th><th>Offset</th><th>Show</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Computed channels</h3>
      <table id="computed-table">
        <thead><tr><th>Name</th><th>Unit</th><th>Expression</th><th>Show</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <button id="add-computed">Add computed</button>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
